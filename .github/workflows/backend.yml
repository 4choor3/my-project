name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-24.04  # 固定版本，避免自动迁移

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5  # 升级到 v5，支持 Node 24

      - name: Install uv
        uses: astral-sh/setup-uv@v5  # 检查是否有更新版本
        with:
          enable-cache: true
          version: "0.8.x"  # 固定 uv 版本，与本地一致

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/src
